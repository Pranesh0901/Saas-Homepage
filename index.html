<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Adaline Style Landing Page</title>

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f2eb;
      color: #222;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 50px;
    }

    .nav-left {
      display: flex;
      gap: 35px;
      letter-spacing: 0.25em;
      font-size: 13px;
      text-transform: uppercase;
    }

    .nav-left span {
      cursor: pointer;
    }

    .logo {
      font-size: 22px;
      font-weight: 600;
    }

    .nav-right {
      display: flex;
      gap: 15px;
    }

    .demo-btn {
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
    }

    .start-btn {
      padding: 8px 20px;
      border-radius: 20px;
      border: none;
      background: #2f4f2f;
      color: white;
      cursor: pointer;
    }

    /* HERO SECTION */
    .hero {
      height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 20px;
    }

    .hero h1 {
      font-size: 44px;
      font-weight: 500;
      line-height: 1.3;
      max-width: 900px;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="nav-left">
      <span>Products</span>
      <span>Pricing</span>
      <span>Blog</span>
    </div>

    <div class="logo">Adaline</div>

    <div class="nav-right">
      <button class="demo-btn">Watch Demo</button>
      <button class="start-btn">Get Started</button>
    </div>
  </div>

  <!-- HERO -->
  <div class="hero">
    <h1>
      The single platform to iterate,<br>
      evaluate, deploy, and monitor LLMs
    </h1>
  </div>

</body>
</html>
